[package]
name = "minitui"
version = "0.1.11"
authors = ["Mikko Tanner <mikko.tanner@gmail.com>"]
description = "Minimal plumbing for implementing a safe TUI in Rust"
readme = "README.md"
repository = "https://github.com/Ukko-Ylijumala/minitui-rs"
license = "MIT OR Apache-2.0"
categories = ["command-line-programming"]
keywords = ["tui", "ratatui"]
publish = false
edition = "2024"
# ratatui 0.30 requires 1.88
rust-version = "1.88"

[features]
# LogSink: a `log` crate backend feeding a LogBuffer
log = ["dep:log"]
# the system's time zone for a log's times: timesince's UtcOffset::local_at and
# CivilTime::now_local (libc's localtime_r; Unix only)
local = ["timesince/local"]

[dependencies]
signal-hook = "0.3"
crossterm = "0.29"
# already in the tree through crossterm; here for the stderr capture's dup2 and poll
rustix = { version = "1", features = ["event", "stdio"] }
log = { version = "0.4", optional = true, features = ["std"] }
# lean: only the crossterm backend, pinned to the same crossterm as above.
# unstable-rendered-line-info: Paragraph::line_count, used by wrap_lines only
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
# already in the tree through ratatui; here for the names the lexers of `syntax` know
strum = { version = "0.28", features = ["derive"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

# the times of a LogView and the spans of a TimeChart: DateFormat, UtcOffset and
# DurationFormat. Without its serde feature it has no dependencies of its own
[dependencies.timesince]
git = "https://github.com/Ukko-Ylijumala/timesince-rs"
version = "0.3.5"
default-features = false

[package]
name = "minitui"
version = "0.1.3"
authors = ["Mikko Tanner <mikko.tanner@gmail.com>"]
description = "Minimal plumbing for implementing a safe TUI in Rust"
readme = "README.md"
repository = "https://github.com/Ukko-Ylijumala/minitui-rs"
license = "MIT OR Apache-2.0"
categories = ["command-line-programming"]
keywords = ["tui", "ratatui"]
publish = false
edition = "2024"
# ratatui 0.30 requires 1.88
rust-version = "1.88"

[dependencies]
signal-hook = "0.3"
crossterm = "0.29"
# lean: only the crossterm backend, pinned to the same crossterm as above.
# unstable-rendered-line-info: Paragraph::line_count, used by wrap_lines only
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[package]
name = "minitui"
version = "0.1.0"
authors = ["Mikko Tanner <mikko.tanner@gmail.com>"]
description = "Minimal plumbing for implementing a safe TUI in Rust"
readme = "README.md"
repository = "https://github.com/Ukko-Ylijumala/minitui-rs"
license = "MIT OR Apache-2.0"
categories = ["command-line-programming"]
keywords = ["tui", "ratatui"]
publish = false
edition = "2024"

[dependencies]
signal-hook = "0.3"
crossterm = "0.29"
ratatui = "0.30"
